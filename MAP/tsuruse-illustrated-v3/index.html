<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鶴瀬・イラスト詳細版の比較</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf9ec;color:#294536;font-family:system-ui}header{padding:16px 20px;background:#fffdf2;border-bottom:1px solid #d0d8ba}h1{font-size:20px;margin:0 0 8px}p{font-size:12px;margin:6px 0;line-height:1.6}nav{display:flex;gap:6px;flex-wrap:wrap}button,select{padding:9px;border:1px solid #afba9b;border-radius:8px;background:white;color:#294536;font-size:12px}canvas{display:block;width:100vw;height:calc(100dvh - 190px);touch-action:none}footer{padding:10px 20px;font-size:12px;background:#fffdf2}#status{margin:0}button[aria-pressed=true]{background:#dfedcc}</style><header><h1>鶴瀬の街 — イラスト詳細版</h1><p>ドラッグで移動。＋／−で拡大。描き直した13区画を確認できます。<br>背景の比較用です。道路の接続・通行判定は未調整です。</p><nav><select aria-label="詳細区画"></select><button id="overview">全体</button><button id="source">元画像と比較</button><button id="bounds">区画を表示</button><button id="plus">＋</button><button id="minus">−</button></nav></header><canvas></canvas><footer><p id="status">読込中…</p></footer><script type="module">import {startPreview} from './preview.js';startPreview({baseUrl:'./'}).catch(e=>document.querySelector('#status').textContent=e.message);</script></html>
