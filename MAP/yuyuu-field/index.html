<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ゆうゆうの丘公園・歩行サンプル</title><link rel="stylesheet" href="field.css"><style>html,body{margin:0;height:100%;background:#263f35}#field{height:100dvh;max-width:560px;margin:auto}</style><main id="field"></main><script type="module">import {createField} from './field.js';try{const r=await fetch('./map.json');if(!r.ok)throw Error('map load failed');const map=await r.json();window.field=await createField(document.querySelector('#field'),{map});}catch(e){document.querySelector('#field').textContent=e.message;}</script></html>
