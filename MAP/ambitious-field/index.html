<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>アンビシャス</title><link rel="stylesheet" href="field.css"><style>body{margin:0}#field{height:100dvh;max-width:560px;margin:auto}</style><main id="field"></main><script type="module">import {createField} from "./field.js";const map=await (await fetch("./map.json")).json();function addEntrances(field){const box=document.querySelector('.field-tools');for(const entry of map.entrances){const b=document.createElement('button');b.textContent=entry.name.replace('道路','入口');b.onclick=()=>field.setPosition(entry.x,entry.y);box.appendChild(b);}window.field=field;}createField(document.querySelector("#field"),{map}).then(addEntrances);</script></html>
